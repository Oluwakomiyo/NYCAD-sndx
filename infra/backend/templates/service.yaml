apiVersion: v1
kind: Service
metadata:
  name: {{ include "backend.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "backend.name" . }}
spec:
  type: ClusterIP
  selector:
    app: {{ include "backend.name" . }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}