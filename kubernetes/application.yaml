apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: NYCAD-argocd
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/Oluwakomiyo/NYCAD-sndx.git'
    targetRevision: HEAD
    path: NYCAD-sndx
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: my-app-namespace
  syncPolicy:
    syncOptions:
      - CreateNamespace=true   
    automated:
      prune: true
      selfHeal: true