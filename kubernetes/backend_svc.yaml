# k8s/backend/backend-service.yaml
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: nycad-app
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "4000"
    prometheus.io/path: "/metrics"
spec:
  selector:
    app: backend
  ports:
    - port: 4000
      targetPort: 4000
  type: ClusterIP